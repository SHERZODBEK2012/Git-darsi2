<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Fire Tavsiyasi</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Verdana, sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
    display:flex;
    justify-content:center;
    padding:30px;
}

.box{
    width:100%;
    max-width:600px;
    background:white;
    border-radius:20px;
    padding:25px;
    text-align:center;
    box-shadow:0 0 25px rgba(0,0,0,0.4);
}

h1{
    color:#ff6b00;
    margin-bottom:15px;
}

h3{
    color:#333;
    margin-bottom:20px;
}

img{
    width:100%;
    max-width:300px;
    border-radius:20px;
    border:4px solid #ff6b00;
    margin-bottom:20px;
}

.btn{
    display:inline-block;
    text-decoration:none;
    background:#ff6b00;
    color:white;
    padding:15px 35px;
    border-radius:30px;
    margin:10px;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
}

.progress-box{
    margin-top:25px;
}

progress{
    width:90%;
    height:25px;
}
</style>
</head>

<body>

<div class="box">

<h1>SIZ UCHUN TAVSIYA ETILGAN O'YIN</h1>
<h3>Bu o'yinning nomi Free Fire</h3>

<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRQMEzyhBGGrUcmBumQT7MwLUEvtycUeuwGFunsqExPsGf8VBKQZldo-VK6&s=10" alt="Free Fire">

<br>

<a class="btn" href="https://play.google.com/store/apps/details?id=com.dts.freefireth" target="_blank">
YUKLAB OLISH
</a>

<div class="progress-box">
<h2>YUKLAGANLAR</h2>
<progress value="79" max="100"></progress>
<p>79%</p>
</div>

</div>

</body>
</html>
